# LiveKit media server config. Keys come from LIVEKIT_KEYS and the public IP
# from --node-ip (both set in docker-compose.yml from .env).
port: 7880
log_level: info

rtc:
  # All media over one UDP port (plus TCP fallback), so the firewall needs
  # only: 7881/tcp, 7882/udp, 3478/udp.
  udp_port: 7882
  tcp_port: 7881
  # Never contact public STUN servers: they are unreachable during a shutdown.
  use_external_ip: false

# Built-in TURN relay for clients behind strict NAT.
turn:
  enabled: true
  udp_port: 3478

webhook:
  api_key: amorechat
  urls:
    - http://app:3000/api/livekit/webhook

room:
  empty_timeout: 60
  departure_timeout: 20
