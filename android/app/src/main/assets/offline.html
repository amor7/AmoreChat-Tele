<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmoreChat</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; background: #0b0e1a; color: #e6e8f5;
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; text-align: center; }
  .box { width: 100%; max-width: 340px; }
  .icon { font-size: 52px; }
  p { color: #8f97b8; line-height: 1.8; }
  .addr { direction: ltr; font-family: monospace; color: #c7d2fe; }
  button { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
  button.alt { background: #1b2138; }
  button.danger { background: #3a1420; color: #fecdd3; }
  h4 { margin: 22px 0 4px; color: #c7d2fe; font-size: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h2>به سرور وصل نشد</h2>
  <p><span class="addr" id="addr"></span><br>اینترنت یا اتصال به این سرور قطع است. خودکار دوباره تلاش می‌کنیم.</p>
  <button onclick="AmoreAndroid.reload()">تلاش دوباره</button>
  <div id="others"></div>
  <button class="alt" onclick="AmoreAndroid.addServer()">افزودن سرور دیگر</button>
  <button class="danger" id="leave">خروج کامل از این سرور</button>
</div>
<script>
  let servers = [];
  try {
    servers = JSON.parse(AmoreAndroid.servers ? AmoreAndroid.servers() : '[]');
  } catch (e) {}
  const cur = servers.find((s) => s.current);
  document.getElementById('addr').textContent = cur ? cur.name : '';
  const others = servers.filter((s) => !s.current);
  if (others.length) {
    const box = document.getElementById('others');
    box.innerHTML = '<h4>سرورهای دیگر شما</h4>';
    for (const s of others) {
      const b = document.createElement('button');
      b.className = 'alt';
      b.textContent = s.name;
      b.dir = 'ltr';
      b.onclick = () => AmoreAndroid.switchServer(s.url);
      box.appendChild(b);
    }
  }
  document.getElementById('leave').onclick = () => {
    if (!cur) return AmoreAndroid.changeServer();
    if (confirm('از «' + cur.name + '» کامل خارج شوید؟\nورود و اطلاعات این سرور از گوشی پاک می‌شود.')) AmoreAndroid.removeServer(cur.url);
  };
  // Keep trying while nobody touches anything.
  let touched = false;
  document.addEventListener('pointerdown', () => (touched = true));
  setInterval(() => !touched && AmoreAndroid.reload(), 10000);
</script>
</body>
</html>
