# Every service rotates its own log: the default json-file driver never deletes, so a long
# outage (no admin around to clean up) would slowly fill the disk with logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: amorechat:latest
    build: .
    restart: unless-stopped
    logging: *logging
    # The app runs as a normal user and needs no Linux capabilities; dropping them all (and
    # blocking setuid gains) limits what a bug in a parsed file or in TDLib could do.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=amorechat
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - BACKUP_MIRROR=${BACKUP_MIRROR_DIR:-}
      # for the HTTPS certificate expiry warning (asks the caddy service)
      - DOMAIN=${DOMAIN}
      - TLS_MODE=${TLS_MODE:-auto}
      # Tele (Telegram bridge)
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - SING_BOX_PATH=${SING_BOX_PATH:-/usr/local/bin/sing-box}
      - TELE_SOCKS_PORT=${TELE_SOCKS_PORT:-17890}
      - TELE_IDLE_MINUTES=${TELE_IDLE_MINUTES:-10}
      # Key for the encrypted Telegram sessions (made by deploy/ensure-env.sh; keep it with the .env)
      - TELE_SESSION_KEY=${TELE_SESSION_KEY:-}
    volumes:
      - ./data:/data
      # Second backup copy (another disk / USB / network share): BACKUP_MIRROR_DIR in .env
      - ${BACKUP_MIRROR_DIR:-./data/no-mirror}:/mirror
      # Whole-server network traffic for the health dashboard (read-only)
      - /proc/1/net/dev:/host/proc/1/net/dev:ro
    expose:
      - '3000'

  # OpenVPN configs of the Tele VPN (if the admin adds any): the same image, with the network rights
  # a VPN client needs, which the app itself does not get. Each config is a tunnel used only by
  # Telegram traffic (see server/ovpn/); with no OpenVPN config it only waits.
  ovpn:
    image: amorechat:latest
    pull_policy: never
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging
    user: root
    cap_add:
      - NET_ADMIN
    init: true
    entrypoint: ['/bin/sh', '/app/server/ovpn/supervisor.sh']
    healthcheck:
      disable: true
    volumes:
      - ./data:/data

  # Voice/video media server (calls, voice chats, streaming).
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml --node-ip ${PUBLIC_IP:-127.0.0.1}
    environment:
      - 'LIVEKIT_KEYS=amorechat: ${LIVEKIT_API_SECRET:-}'
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881'
      - '7882:7882/udp'
      - '3478:3478/udp'

  caddy:
    # Pinned (like LiveKit): updates only download it again when a release moves to a newer one.
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    # The caddy binary carries the cap_net_bind_service file capability (for ports 80/443);
    # without it in the bounding set the kernel refuses to exec it at all.
    # DAC_READ_SEARCH: with TLS_MODE=custom the admin's ./certs/key.pem is often owned by
    # another user with mode 600; without DAC_OVERRIDE even root in the container can't open
    # it and Caddy won't start. This one only lets it read (and list), never write.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    security_opt: ['no-new-privileges:true']
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - DOMAIN=${DOMAIN}
      - TLS_MODE=${TLS_MODE:-auto}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
